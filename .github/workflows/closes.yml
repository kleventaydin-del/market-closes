name: Daily closes
on:
  schedule:
    - cron: "30 22 * * 1-5"   # after the US close (winter and summer)
    - cron: "30 4 * * 2-6"    # morning retry before the brief
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_closes.py
      - name: Commit results
        run: |
          git config user.name "closes-bot"
          git config user.email "closes-bot@users.noreply.github.com"
          git add closes.csv latest.json
          git diff --cached --quiet || git commit -m "Update closes $(date -u +%F)"
          git push
